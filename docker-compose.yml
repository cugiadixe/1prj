services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:?DB_SA_PASSWORD chua duoc dat trong .env}"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: src/backend
      dockerfile: Dockerfile.migrator
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=${DB_NAME:-PTKD_PROD};User Id=sa;Password=${DB_SA_PASSWORD:?DB_SA_PASSWORD chua duoc dat trong .env};TrustServerCertificate=True"
    volumes:
      - ./database/migrations:/app/database/migrations:ro
      - ./database/rollbacks:/app/database/rollbacks:ro
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DefaultConnection: "Server=db;Database=${DB_NAME:-PTKD_PROD};User Id=sa;Password=${DB_SA_PASSWORD:?DB_SA_PASSWORD chua duoc dat trong .env};TrustServerCertificate=True"
      Cors__AllowedOrigins__0: "${CORS_ORIGIN:-http://localhost}"
      # Khoá ký JWT BỀN (RS256): file PEM mount read-only từ host → token còn hiệu lực sau restart.
      # Khoá nằm ở secrets/ (đã gitignore, KHÔNG commit). Sinh lại bằng:
      #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out secrets/jwt-signing-prod.pem
      Jwt__SigningKeyPath: "/keys/jwt-signing.pem"
    volumes:
      - ./secrets/jwt-signing-prod.pem:/keys/jwt-signing.pem:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v2
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  sqldata:
