services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:-YourStr0ngP@ssword!}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DefaultConnection: "Server=db;Database=PTKD_PROD;User Id=sa;Password=${DB_SA_PASSWORD:-YourStr0ngP@ssword!};TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v2
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqldata:
